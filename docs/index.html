<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>THE ROUTE · Cambridge live buses</title>
<meta name="description" content="Every Cambridge bus live on a map, with stop-by-stop arrival times and departure boards.">
<meta name="theme-color" content="#212529">
<!-- UI kit: NES.css (MIT, github.com/nostalgic-css/NES.css) · type: Departure Mono (OFL, github.com/rektdeckard/departure-mono) + Press Start 2P (OFL) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nes.css@2.3.0/css/nes.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  @font-face{font-family:"Departure Mono"; src:url("fonts/DepartureMono-Regular.woff2") format("woff2"); font-display:swap}
  :root{
    --night:#181a1f; --panel:#212529; --card:#2b3036; --line:#3a3f47; --ink:#f4f4f0; --dim:#9aa1ab;
    --blue:#209cee; --green:#92cc41; --gold:#f7d51d; --red:#e76e55;
    --mono:"Departure Mono", ui-monospace, Menlo, Consolas, monospace;
    --pixel:"Press Start 2P", var(--mono);
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{background:var(--night); color:var(--ink); overflow:hidden; font:11px/1.6 var(--mono); display:flex; flex-direction:column; -webkit-font-smoothing:none}
  button, .nes-btn{font-family:var(--mono)}
  a{color:var(--blue)}
  .muted{color:var(--dim)} .gold{color:var(--gold)} .green{color:var(--green)}

  /* ---------------------------------------------------------- top bar */
  .topbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:10px 16px; background:var(--panel); border-bottom:4px solid #000}
  .logo{font:14px var(--pixel); letter-spacing:1px; white-space:nowrap}
  .logo b{color:var(--gold); font-weight:400}
  .tag{color:var(--dim); letter-spacing:2px}
  .topbar .live{display:flex; gap:8px; align-items:center; color:var(--dim)}
  #dot{width:8px; height:8px; background:var(--green); box-shadow:0 0 0 2px #000; animation:blink 1.6s steps(2) infinite}
  #dot.stale{background:var(--red); animation:none}
  @keyframes blink{50%{opacity:.25}}
  .topbar .right{margin-left:auto; display:flex; gap:12px; align-items:center}
  #acc{padding:0 6px; box-shadow:0 0 0 2px #000; cursor:help; white-space:nowrap}
  #acc.exact{background:var(--green); color:#000}
  #acc.est{background:var(--card); color:var(--dim)}
  #clock{font:10px var(--pixel); color:var(--ink)}

  main{flex:1; display:flex; min-height:0}
  #stage{flex:1; position:relative; min-width:0; overflow:hidden; background:#e9e6dc}
  canvas{position:absolute; left:0; top:0; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none}

  /* ---------------------------------------------------------- map HUD */
  .hud-l{position:absolute; left:12px; top:12px; z-index:4; max-width:min(420px,58%)}
  .hud-r{position:absolute; right:12px; top:12px; z-index:4; display:flex; flex-direction:column; gap:10px; align-items:flex-end}
  .hud-r .nes-btn{font-size:11px; padding:2px 8px; margin:0}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font:11px var(--mono); padding:1px 6px; color:#000; cursor:pointer; user-select:none; box-shadow:0 0 0 2px #000; border:0; line-height:16px}
  .chip.off{opacity:.3}
  .chip.all{background:var(--panel); color:var(--gold)}
  .hint{position:absolute; left:12px; bottom:12px; z-index:4; background:var(--panel); color:var(--dim); padding:3px 8px; box-shadow:0 0 0 2px #000; pointer-events:none}
  .hint b{color:var(--gold); font-weight:400}
  #toast{position:absolute; left:50%; top:16px; transform:translate(-50%,-12px); z-index:9; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none;
    background:#fff; color:#212529; padding:8px 14px; box-shadow:0 0 0 4px #000; max-width:90%; text-align:center}
  #toast.show{opacity:1; transform:translate(-50%,0)}
  #bRecenter{position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:5; font-size:11px; padding:2px 10px; margin:0}

  /* ---------------------------------------------------------- sidebar */
  aside{width:370px; background:var(--panel); border-left:4px solid #000; display:flex; flex-direction:column; min-height:0}
  .search{position:relative; padding:12px 14px 0}
  .search input{width:100%; font:11px var(--mono); padding:7px 9px; background:var(--card); color:var(--ink); border:0; outline:0;
    box-shadow:0 0 0 2px #000, inset 0 0 0 2px var(--line); -webkit-appearance:none; border-radius:0}
  .search input:focus{box-shadow:0 0 0 2px var(--gold)}
  #results{position:absolute; left:14px; right:14px; top:46px; z-index:20; background:var(--panel); box-shadow:0 0 0 2px #000, 0 6px 0 rgba(0,0,0,.35); max-height:330px; overflow:auto}
  #results div{display:flex; gap:8px; align-items:center; padding:7px 9px; border-bottom:2px dotted var(--line); cursor:pointer}
  #results div:hover{background:var(--card)}
  .sd{width:10px; height:10px; border-radius:50%; background:#fff; box-shadow:0 0 0 2px #000; flex:0 0 10px; display:inline-block}
  .pad{padding:18px 14px 0; max-height:68vh; overflow-y:auto}
  aside:not(.has-card) .pad{display:none}
  .nes-container.is-dark{background:var(--panel); padding:14px 14px 12px; margin:6px 0 16px}
  .nes-container.with-title>.title{font:10px var(--pixel); background:var(--panel); padding:0 8px; margin-top:-21px; margin-bottom:10px}
  .head{display:flex; align-items:center; gap:10px}
  .head h2{font:400 11px var(--mono); margin:0; flex:1; min-width:0}
  .head .x{cursor:pointer; color:var(--dim); font-size:13px; padding:0 2px}
  .rt{display:inline-block; font:11px var(--mono); padding:0 6px; color:#000; line-height:16px; box-shadow:0 0 0 2px #000; min-width:22px; text-align:center}
  .rt.big{font:12px var(--pixel); padding:5px 7px; line-height:12px}
  .status{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 8px}
  .tagx{padding:0 6px; box-shadow:0 0 0 2px #000; background:var(--card)}
  .tagx.green{background:var(--green); color:#000} .tagx.late{background:var(--red); color:#000} .tagx.early{background:var(--blue); color:#000}
  .where{margin:4px 0 12px}
  .where b{font-weight:400; color:var(--gold)}
  .journey .ends{display:flex; justify-content:space-between; gap:10px; color:var(--dim)}
  .journey .track{position:relative; height:8px; background:#000; margin:6px 0}
  .journey .track i{position:absolute; inset:0 auto 0 0; background:var(--gold)}
  .journey .track b{position:absolute; top:-4px; width:6px; height:16px; margin-left:-3px; background:#fff; box-shadow:0 0 0 2px #000}
  h3{font:9px var(--pixel); color:var(--dim); margin:16px 0 8px; letter-spacing:1px}
  ul.eta{list-style:none; padding:0; margin:4px 0 0}
  ul.eta li{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:2px dotted var(--line); cursor:pointer}
  ul.eta li:hover .nm{color:var(--gold)}
  ul.eta li .dot{width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 0 2px #000; flex:0 0 8px}
  ul.eta li.next .dot{background:var(--gold)}
  ul.eta li.next .nm, ul.eta li.next .in{color:var(--gold)}
  ul.eta li.ext .nm{color:var(--dim)}
  ul.eta .nm{flex:1; min-width:0}
  ul.eta .nm small{display:block; color:var(--dim); font-size:10px}
  ul.eta .in{min-width:46px; text-align:right; white-space:nowrap}
  ul.eta .at{color:var(--dim); min-width:38px; text-align:right}
  .bell{background:none; border:0; cursor:pointer; padding:0 2px; font-size:12px; opacity:.4; filter:grayscale(1)}
  .bell.on{opacity:1; filter:none}
  .src{font-size:10px; padding:0 4px; color:var(--dim); box-shadow:0 0 0 1px var(--line); white-space:nowrap}
  .src.live, .src.green{color:#000; background:var(--green); box-shadow:none}
  .src.late{color:#000; background:var(--red); box-shadow:none} .src.early{color:#000; background:var(--blue); box-shadow:none}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; margin-top:12px}
  .kv span:nth-child(odd){color:var(--dim)}
  .acts{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
  .acts .nes-btn{font-size:11px; padding:2px 8px; margin:0}
  .nes-btn.more{font-size:10px; padding:0 8px; margin:10px 0 0}
  .note{color:var(--dim); margin:10px 0 0; font-size:10px}
  .tabs{display:flex; gap:8px; padding:12px 14px 4px}
  .tabs .nes-btn{flex:1; font:9px var(--pixel); padding:6px 0; margin:0}
  #panel{flex:1; overflow-y:auto; padding:10px 14px 18px}
  .stopbox{background:var(--card); box-shadow:0 0 0 2px #000; padding:8px 9px; margin:2px 2px 12px; cursor:pointer}
  .stopbox:hover .nm{color:var(--gold)}
  .stopbox .top{display:flex; gap:8px; align-items:baseline}
  .stopbox .nm{flex:1}
  .stopbox .deps{display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:6px}
  .stopbox .deps span{white-space:nowrap}
  .row{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:2px dotted var(--line); cursor:pointer}
  .row:hover .g{color:var(--gold)}
  .row .g{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  @media (max-width:760px){
    main{flex-direction:column}
    aside{width:auto; height:42%; border-left:0; border-top:4px solid #000}
    aside.has-card{height:55%}
    aside.has-card .tabs, aside.has-card #panel{display:none}
    aside.has-card .pad{max-height:none; flex:1}
    .tag,.hint{display:none}
    .topbar{gap:10px; padding:8px 12px}
    .hud-l{max-width:56%}
    .hud-r{gap:8px}
    .hud-r .nes-btn{font-size:10px; padding:0 6px}
    .chip{font-size:10px; padding:0 4px}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">THE <b>ROUTE</b></div>
  <span class="tag">CAMBRIDGE · LIVE BUSES</span>
  <div class="live"><i id="dot"></i><span id="status">connecting…</span></div>
  <div class="right"><span id="acc" class="est" title="">ESTIMATED</span><span id="clock">--:--</span></div>
</header>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud-l"><div class="chips" id="legend"></div></div>
    <div class="hud-r">
      <button class="nes-btn" id="bHome" title="Back to the city centre">⌂ centre</button>
      <button class="nes-btn" id="bGps" title="Show stops and departures near you">◎ near me</button>
      <button class="nes-btn" id="bRoutes" title="Route lines: live / all / off">routes: live</button>
      <button class="nes-btn" id="bStyle" title="Map style">map: clear</button>
      <button class="nes-btn is-success" id="bStops" title="Show bus stops">stops</button>
    </div>
    <div class="hint"><b>tap</b> a bus to track it · <b>tap</b> a stop for departures · <b>drag</b>/<b>scroll</b> to move</div>
    <button class="nes-btn is-primary" id="bRecenter" hidden>◎ back to the bus</button>
    <div id="toast"></div>
  </div>
  <aside>
    <div class="search"><input id="q" type="search" placeholder="search a stop, area or route…  e.g. Addenbrooke's, PR3" autocomplete="off" enterkeyhint="search"><div id="results" hidden></div></div>
    <div class="pad"><section class="nes-container is-dark with-title" id="card"></section></div>
    <div class="tabs">
      <button class="nes-btn is-warning" data-tab="nearby">NEARBY</button>
      <button class="nes-btn" data-tab="routes">ROUTES</button>
      <button class="nes-btn" data-tab="saved">SAVED</button>
    </div>
    <div id="panel"></div>
  </aside>
</main>
<script>
"use strict";
// ======================================================================
//  THE ROUTE — every Cambridge bus, live: where it is, where it's going,
//  and when it will get to your stop.
//
//  Static data (baked): map tiles, stops, road graph (tools/bake.py), route
//  lines (tools/bake_routes.py), journey patterns + run times + calendars
//  (tools/bake_patterns.py), all from OpenStreetMap / NaPTAN / BODS GTFS.
//  Live data: bustimes.org positions (BODS, OGL), plus — when the relay in
//  worker/ is deployed — the official BODS GTFS-RT feed, which names the exact
//  timetabled trip each bus is running. With it, early/late and ETAs are
//  computed against that trip's own timetable; without it, the trip is inferred.
// ======================================================================
const BUSTIMES_URL = (m) =>
  `https://bustimes.org/vehicles.json?ymax=${m.lat1}&xmax=${m.lon1}&ymin=${m.lat0}&xmin=${m.lon0}`;
const RELAY_DEFAULT = "https://the-route-live.maxwilliamfoster.workers.dev";   // worker/ — official GTFS-RT with exact trip ids
const POLL_MS = 12000;
const HOME = { x: 1880, y: 1680, z: 2 };
const FONT = '"Departure Mono", ui-monospace, Menlo, monospace';

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let META, STOPS = [], LABELS = [], ROUTES = new Map(), G = null;
const tiles = new Map();
const overviews = {};
const cam = { ...HOME };
let DPR = 1, CW = 0, CH = 0;
let showStops = true, routesMode = "live", mapStyle = "clear";
const hiddenRoutes = new Set();

// ---------------------------------------------------------------- utils
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const hash8 = (s) => hash(s).toString(16).padStart(8, "0");     // same as fnv() in tools/bake_patterns.py
function proj(lat, lon) { return [(lon - META.lon0) * META.mPerDegLon / META.mpp, (META.lat1 - lat) * META.mPerDegLat / META.mpp]; }
function unproj(x, y) { return [META.lat1 - y * META.mpp / META.mPerDegLat, META.lon0 + x * META.mpp / META.mPerDegLon]; }
const toScreen = (x, y) => [(x - cam.x) * cam.z * DPR + CW / 2, (y - cam.y) * cam.z * DPR + CH / 2];
const toMap = (sx, sy) => [(sx - CW / 2) / (cam.z * DPR) + cam.x, (sy - CH / 2) / (cam.z * DPR) + cam.y];
const metres = (px) => px * META.mpp;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3000); }
function store(k, v) { try { localStorage.setItem(k, v); } catch {} }
function recall(k) { try { return localStorage.getItem(k); } catch { return null; } }
const distTxt = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;

// relay URL: ?relay=https://... once (remembered), or RELAY_DEFAULT
let RELAY = (() => {
  const q = new URLSearchParams(location.search).get("relay");
  if (q !== null) { store("theroute_relay", q); return q || RELAY_DEFAULT; }   // ?relay= resets to the default
  return recall("theroute_relay") || RELAY_DEFAULT;
})();

// saved stops
const SAVED = new Set((() => { try { return JSON.parse(recall("theroute_saved") || "[]"); } catch { return []; } })());
const saveSaved = () => store("theroute_saved", JSON.stringify([...SAVED]));

// ---------------------------------------------------------- route colours
const ROUTE_COL = {
  "1": "#e4422f", "2": "#1f8fe0", "3": "#3aa655", "4": "#e9b11a", "5": "#9b59d0", "6": "#f07d1e",
  "7": "#14b3a3", "8": "#e0458b", "8A": "#c2387a", "13": "#a8743e", "13A": "#8c6034", "18": "#4d8f8f",
  "U1": "#76b82a", "U2": "#5f9be8", "A": "#ff7a1a", "B": "#2f5fd0", "C": "#b7b51c",
  "X3": "#c94f4f", "X13": "#7a5ac8", "905": "#6f7787", "PR1": "#5fb3e8", "PR2": "#f0a04b",
  "PR3": "#62bf6a", "PR4": "#c86ad0", "PR5": "#e86a6a", "T2": "#3c9a7a", "T3": "#a06ad0",
  "T4": "#d08a3c", "T5": "#3c7ad0", "Tour": "#d4a017",
};
const FALLBACK = ["#d9534f", "#2a9fd6", "#4cae4c", "#e6a817", "#9b59d0", "#f0782d", "#17a2b8", "#e83e8c", "#7cb342", "#5c6bc0"];
const routeColour = (line) => !line ? "#8a909a" : ROUTE_COL[line] || FALLBACK[hash(line) % FALLBACK.length];
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#000" : "#fff";
}
const pill = (line, big) => `<span class="rt${big ? " big" : ""}" style="background:${routeColour(line)};color:${inkFor(routeColour(line))}">${esc(line)}</span>`;
const chip = (l) => `<span class="chip" data-line="${esc(l)}" style="background:${routeColour(l)};color:${inkFor(routeColour(l))}">${esc(l)}</span>`;

// ================================================================ ROAD GRAPH
// Moves between reported positions follow the real road network (A*).
function buildGraph(g) {
  const s = g.scale, N = g.n.length / 2;
  const X = new Float32Array(N), Y = new Float32Array(N);
  for (let i = 0; i < N; i++) { X[i] = g.n[2 * i] / s; Y[i] = g.n[2 * i + 1] / s; }
  const E = g.e.length / 3;
  const ea = new Int32Array(E), eb = new Int32Array(E), eo = new Uint8Array(E);
  const deg = new Int32Array(N + 1);
  for (let k = 0; k < E; k++) { ea[k] = g.e[3 * k]; eb[k] = g.e[3 * k + 1]; eo[k] = g.e[3 * k + 2]; deg[ea[k]]++; if (!eo[k]) deg[eb[k]]++; }
  const off = new Int32Array(N + 1);
  for (let i = 0; i < N; i++) off[i + 1] = off[i] + deg[i];
  const adj = new Int32Array(off[N]), fill = off.slice(0, N);
  for (let k = 0; k < E; k++) { adj[fill[ea[k]]++] = eb[k]; if (!eo[k]) adj[fill[eb[k]]++] = ea[k]; }
  const CELL = 48, gw = Math.ceil(META.W / CELL) + 10;
  const grid = new Map(), cellKey = (cx, cy) => cy * gw + cx;
  for (let k = 0; k < E; k++) {
    const a = ea[k], b = eb[k];
    const x0 = Math.floor(Math.min(X[a], X[b]) / CELL), x1 = Math.floor(Math.max(X[a], X[b]) / CELL);
    const y0 = Math.floor(Math.min(Y[a], Y[b]) / CELL), y1 = Math.floor(Math.max(Y[a], Y[b]) / CELL);
    for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
      const key = cellKey(cx + 5, cy + 5); let l = grid.get(key); if (!l) grid.set(key, l = []); l.push(k);
    }
  }
  return { X, Y, ea, eb, eo, off, adj, grid, CELL, cellKey };
}
function snap(px, py, maxD = 14) {
  const { X, Y, ea, eb, eo, grid, CELL, cellKey } = G;
  const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL), found = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    const l = grid.get(cellKey(cx + dx + 5, cy + dy + 5)); if (!l) continue;
    for (const k of l) {
      const a = ea[k], b = eb[k], vx = X[b] - X[a], vy = Y[b] - Y[a], L2 = vx * vx + vy * vy || 1e-9;
      const t = clamp(((px - X[a]) * vx + (py - Y[a]) * vy) / L2, 0, 1), qx = X[a] + vx * t, qy = Y[a] + vy * t;
      const d = Math.hypot(px - qx, py - qy);
      if (d <= maxD) found.push({ k, t, x: qx, y: qy, d, a, b, ow: eo[k], len: Math.sqrt(L2) });
    }
  }
  found.sort((p, q) => p.d - q.d);
  const out = [], seen = new Set();
  for (const f of found) { if (seen.has(f.k)) continue; seen.add(f.k); out.push(f); if (out.length >= 3) break; }
  return out;
}
function route(s, e, limit = 6000) {
  const { X, Y, off, adj } = G;
  const gScore = new Map(), came = new Map(), heap = [];
  const push = (n, f) => { heap.push([f, n]); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  const H_ = (n) => Math.hypot(X[n] - e.x, Y[n] - e.y);
  if (s.k === e.k && (e.t >= s.t || !s.ow)) return { pts: [[s.x, s.y], [e.x, e.y]], len: Math.hypot(e.x - s.x, e.y - s.y) };
  const startN = [[s.b, (1 - s.t) * s.len]]; if (!s.ow) startN.push([s.a, s.t * s.len]);
  for (const [n, c] of startN) { gScore.set(n, c); came.set(n, -1); push(n, c + H_(n)); }

    <h3>NEXT STOPS</h3>
    <ul class="eta">${ups.map((u, k) => {
      const key = b.id + "|" + u.id, on = alerts.has(key);
      return `<li data-stop="${esc(u.id)}" class="${k === 0 ? "next" : ""}${u.s.ext ? " ext" : ""}">
        <span class="dot"></span><span class="nm">${esc(stopLabel(u.s))}${u.sched != null && hm(u.sched) !== hm(u.at) ? `<small>timetabled ${hm(u.sched)}</small>` : ""}</span>
        <span class="in">${mins(u.eta)}</span><span class="at">${hm(u.at)}</span>
        <button class="bell ${on ? "on" : ""}" data-alert="${esc(key)}" title="Alert me 2 min before it gets here">${on ? "⏰" : "🔔"}</button></li>`;
    }).join("")}</ul>
    ${J.up.length > 8 ? `<button class="nes-btn more" id="aMore">${showAllStops ? "show fewer" : `show all ${J.up.length} stops`}</button>` : ""}
    <p class="note">${esc(HOW[J.how])}${J.how === "matched" && !relayLive() ? " Connect the live relay for exact trips (see README)." : ""}</p>`
    : `<p class="note">This service isn't in the open timetable data, so there are no stop-by-stop times. Its position and speed are still live.</p>`}
    <div class="kv">
      <span>vehicle</span><span>${esc(b.fleet)}${b.reg ? " · " + esc(b.reg) : ""}</span>
      <span>type</span><span>${esc(b.features || "—")}</span>
    </div>
    <div class="acts">
      ${following === b.id ? "" : `<button class="nes-btn is-primary" id="aFollow">◎ follow</button>`}
      <a class="nes-btn" href="https://bustimes.org${esc(b.url)}" target="_blank" rel="noopener">vehicle ↗</a>
    </div>`;
}

function depRows(list, n = 12) {
  return list.slice(0, n).map((d) => {
    const st = d.bus ? delayText(d.delay) : null;
    return `<li ${d.bus ? `data-id="${d.bus.id}"` : ""}>${pill(d.line)}<span class="nm">${esc(d.head)}</span>
      <span class="in">${mins(d.eta)}</span><span class="at">${hm(d.at)}</span>
      <span class="src ${d.bus ? (st.c || "live") : ""}">${d.bus ? (d.delay == null ? "live" : st.t) : "timetable"}</span></li>`;
  }).join("");
}

function stopCard(s) {
  const deps = departures(s.id);
  const dm = meTo(s.x, s.y), saved = SAVED.has(s.id);
  return `
    <p class="title">STOP</p>
    <div class="head"><span class="sd"></span><h2>${esc(s.name)}${s.ind ? ` <span class="muted">(${esc(s.ind)})</span>` : ""}<br><span class="muted">${esc([s.street, s.loc].filter(Boolean).join(", "))}${dm != null ? ` · ${distTxt(dm)} from you` : ""}</span></h2><span class="x" id="cx">✕</span></div>
    <h3>ROUTES HERE</h3>
    <div class="chips">${(s.l || []).map(chip).join("") || '<span class="muted">no timetabled routes</span>'}</div>
    <h3>DEPARTURES</h3>
    <ul class="eta">${deps.length ? depRows(deps) : '<li class="muted">nothing due in the next 90 minutes</li>'}</ul>
    <p class="note">Coloured = a live bus (tap to track it) · "timetable" = no bus on the road yet</p>
    <div class="acts">
      <button class="nes-btn ${saved ? "is-warning" : ""}" id="aSave">${saved ? "★ saved" : "☆ save stop"}</button>
      <a class="nes-btn" href="https://bustimes.org/stops/${esc(s.id)}" target="_blank" rel="noopener">full timetable ↗</a>
    </div>`;
}

function lineCard(line) {
  const R = ROUTES.get(line);
  const list = [...buses.values()].filter((b) => !b.gone && b.line === line).map((b) => ({ b, J: journey(b) }));
  return `
    <p class="title">ROUTE</p>
    <div class="head">${pill(line, true)}<h2>${esc(R?.heads?.slice(0, 2).join(" ⇄ ") || "")}</h2><span class="x" id="cx">✕</span></div>
    <h3>${list.length} BUS${list.length === 1 ? "" : "ES"} RUNNING</h3>
    <ul class="eta">${list.map(({ b, J }) => {
      const st = delayText(J?.delay);
      return `<li data-id="${b.id}"><span class="nm">→ ${esc(b.dest || J?.P.head || "?")}<small>${J?.up[0] ? "next: " + esc(J.up[0].s.name) + " · " + mins(J.up[0].eta) : "position live"}</small></span>
        <span class="src ${st.c}">${esc(J ? st.t : "live")}</span></li>`;
    }).join("") || '<li class="muted">none running right now</li>'}</ul>
    <p class="note">Tap a bus to track it.</p>`;
}

function renderCard() {
  const el = $("card");
  document.querySelector("aside").classList.toggle("has-card", !!sel);
  if (!sel) { el.innerHTML = ""; return; }
  if (sel.type === "bus") {
    const b = buses.get(sel.id);
    if (!b) { closeCard(); toast("That bus has finished its journey"); return; }
    el.innerHTML = busCard(b);
    if ($("aMore")) $("aMore").onclick = () => { showAllStops = !showAllStops; renderCard(); };
    if ($("aFollow")) $("aFollow").onclick = () => { following = b.id; cam.z = Math.max(cam.z, 2.2); renderCard(); showRecenter(); };
    el.querySelectorAll("[data-alert]").forEach((x) => x.onclick = (e) => {
      e.stopPropagation();
      const k = x.dataset.alert;
      if (alerts.has(k)) { alerts.delete(k); toast("Alert off"); }
      else {
        alerts.set(k, false); toast("⏰ You'll get an alert 2 min before it arrives");
        try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch {}
      }
      renderCard();
    });
    el.querySelectorAll("li[data-stop]").forEach((li) => li.onclick = () => {
      const s = stopInfo(li.dataset.stop);
      if (s.x != null) { following = null; cam.x = s.x; cam.y = s.y; showRecenter(); }
    });
  } else if (sel.type === "stop") {
    const s = STOP_BY_ID.get(sel.id);
    if (!s) { closeCard(); return; }
    el.innerHTML = stopCard(s);
    $("aSave").onclick = () => {
      if (SAVED.has(s.id)) SAVED.delete(s.id); else SAVED.add(s.id);
      saveSaved(); toast(SAVED.has(s.id) ? "Saved: it's in the SAVED tab" : "Removed from saved");
      renderCard(); if (tab === "saved") renderPanel();
    };
  } else {
    el.innerHTML = lineCard(sel.id);
  }
  el.querySelectorAll("li[data-id]").forEach((li) => li.onclick = () => select({ type: "bus", id: +li.dataset.id }));
  el.querySelectorAll(".chips [data-line]").forEach((c) => c.onclick = () => focusLine(c.dataset.line));
  $("cx").onclick = closeCard;
}

// ================================================================ PANEL
let tab = "nearby";
function setTab(t) {
  tab = t;
  document.querySelectorAll(".tabs .nes-btn").forEach((x) => x.classList.toggle("is-warning", x.dataset.tab === t));
  renderPanel();
}
document.querySelectorAll(".tabs .nes-btn").forEach((b) => b.onclick = () => setTab(b.dataset.tab));

function stopBox(s, extra = "") {
  const deps = departures(s.id, 3600).slice(0, 4);
  return `<div class="stopbox" data-stop="${esc(s.id)}">
    <div class="top"><span class="sd"></span><span class="nm">${esc(stopLabel(s))}</span><span class="muted">${extra}</span></div>
    <div class="deps">${deps.length ? deps.map((d) => `<span>${pill(d.line)} ${mins(d.eta)}${d.bus ? "" : '<span class="muted">*</span>'}</span>`).join("") : '<span class="muted">nothing in the next hour</span>'}</div>
  </div>`;
}
let nearbyAt = null;
function renderPanel() {
  const P = $("panel");
  if (!META) return;
  if (tab === "nearby") {
    let ox = cam.x, oy = cam.y, from = "the map centre";
    if (ME) { const [x, y] = proj(ME.lat, ME.lon); if (x >= 0 && y >= 0 && x <= META.W && y <= META.H) { ox = x; oy = y; from = "you"; } }
    nearbyAt = [ox, oy];
    const seen = new Set(), list = [];
    for (const s of [...STOPS].sort((a, b) => Math.hypot(a.x - ox, a.y - oy) - Math.hypot(b.x - ox, b.y - oy))) {
      if (list.length >= 6 || metres(Math.hypot(s.x - ox, s.y - oy)) > 1500) break;
      const k = s.name + "|" + s.ind; if (seen.has(k)) continue; seen.add(k); list.push(s);
    }
    P.innerHTML = `
      <h3 style="margin-top:4px">STOPS NEAR ${from === "you" ? "YOU" : "THE MAP CENTRE"}</h3>
      ${from === "you" ? "" : `<p class="note" style="margin:0 0 10px">Move the map, or <a href="#" id="pGps">use my location</a>.</p>`}
      ${list.map((s) => stopBox(s, distTxt(metres(Math.hypot(s.x - ox, s.y - oy))))).join("") || '<p class="muted">No stops within 1.5 km.</p>'}
      <p class="note">* = timetable only (no bus on the road yet). Tap a stop for the full board.</p>`;
    const g = $("pGps"); if (g) g.onclick = (e) => { e.preventDefault(); startGps(); };
  } else if (tab === "routes") {
    const by = new Map();
    for (const b of buses.values()) {
      if (b.gone) continue;
      let r = by.get(b.line); if (!r) by.set(b.line, r = { line: b.line, n: 0, delays: [] });
      r.n++; const J = journey(b); if (J?.delay != null) r.delays.push(J.delay);
    }
    const running = [...by.values()].sort((a, b) => String(a.line).localeCompare(String(b.line), undefined, { numeric: true }));
    const idle = [...ROUTES.keys()].filter((l) => !by.has(l)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    P.innerHTML = `
      <h3 style="margin-top:4px">RUNNING NOW</h3>
      ${running.map((r) => {
        const avg = r.delays.length ? r.delays.reduce((a, b) => a + b, 0) / r.delays.length : null, st = delayText(avg);
        return `<div class="row" data-line="${esc(r.line)}">${pill(r.line)}<span class="g">${esc(ROUTES.get(r.line)?.heads?.slice(0, 2).join(" ⇄ ") || "")}</span>
          <span class="muted">${r.n} bus${r.n > 1 ? "es" : ""}</span><span class="src ${st.c}">${avg == null ? "live" : (Math.abs(avg) < 60 ? "on time" : st.t.replace(" late", " late avg").replace(" early", " early avg"))}</span></div>`;
      }).join("") || '<p class="muted">Loading…</p>'}
      ${idle.length ? `<h3>NOT RUNNING NOW</h3><div class="chips">${idle.map(chip).join("")}</div>` : ""}
      <p class="note">Live: bustimes.org / Bus Open Data Service (OGL) · timetables: BODS · map: OpenStreetMap contributors · stops: NaPTAN</p>`;
    P.querySelectorAll("[data-line]").forEach((r) => r.onclick = () => focusLine(r.dataset.line));
  } else {
    const list = [...SAVED].map((id) => STOP_BY_ID.get(id)).filter(Boolean);
    P.innerHTML = `<h3 style="margin-top:4px">SAVED STOPS</h3>` + (list.length ? list.map((s) => stopBox(s)).join("")
      : `<p class="muted">Open any stop and press ☆ save stop. Its departures will show here.</p>`);
  }
  P.querySelectorAll(".stopbox").forEach((d) => d.onclick = () => select({ type: "stop", id: d.dataset.stop }));
}

function focusLine(line) {
  sel = { type: "line", id: line }; following = null; renderCard(); showRecenter();
  const R = ROUTES.get(line);
  const xs = [...buses.values()].filter((b) => b.line === line).map((b) => [b.x, b.y]);
  if (R) for (const p of R.raw) for (let i = 0; i < p.length; i += 8) xs.push([p[i] / 2, p[i + 1] / 2]);
  if (!xs.length) return;
  const X = xs.map((p) => p[0]), Y = xs.map((p) => p[1]);
  cam.x = (Math.min(...X) + Math.max(...X)) / 2; cam.y = (Math.min(...Y) + Math.max(...Y)) / 2;
  const span = Math.max(Math.max(...X) - Math.min(...X), (Math.max(...Y) - Math.min(...Y)) * (CW / CH), 150);
  cam.z = clamp(CW / DPR / (span * 1.15), 0.3, 3); clampCam();
}
function renderLegend() {
  const lines = [...new Set([...buses.values()].filter((b) => !b.gone).map((b) => b.line))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const L = $("legend");
  L.innerHTML = lines.map((l) => `<span class="chip ${hiddenRoutes.has(l) ? "off" : ""}" data-l="${esc(l)}" style="background:${routeColour(l)};color:${inkFor(routeColour(l))}" title="tap to hide/show">${esc(l)}</span>`).join("")
    + (hiddenRoutes.size ? `<span class="chip all" data-all="1">show all</span>` : "");
  L.querySelectorAll("[data-l]").forEach((el) => el.onclick = () => {
    const l = el.dataset.l; hiddenRoutes.has(l) ? hiddenRoutes.delete(l) : hiddenRoutes.add(l); renderLegend();
  });
  const all = L.querySelector("[data-all]"); if (all) all.onclick = () => { hiddenRoutes.clear(); renderLegend(); };
}
function onLiveUpdate() { renderLegend(); renderPanel(); if (sel) renderCard(); }
function tickStatus() {
  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
  const all = [...buses.values()].filter((b) => !b.gone), exact = all.filter((b) => b.m?.how === "exact").length;
  $("status").textContent = age == null ? "connecting…" : `${all.length} buses live · ${age}s ago`;
  $("dot").classList.toggle("stale", age == null || age > 60);
  $("clock").textContent = hm(Date.now());
  const acc = $("acc");
  if (relayLive()) {
    acc.className = "exact"; acc.textContent = `EXACT TRIPS ${exact}/${all.length}`;
    acc.title = "The official live feed names the timetabled trip for these buses, so early/late and arrival times are computed against their real timetable.";
  } else {
    acc.className = "est"; acc.textContent = "ESTIMATED TRIPS";
    acc.title = RELAY ? `Live relay not answering (${rtErr || "no data yet"}). Trips are inferred from position.` : "Trips are inferred from each bus's position, direction and destination. Deploy the relay in worker/ for exact trips.";
  }
}

// ================================================================ SEARCH
function runSearch() {
  const q = $("q").value.trim().toLowerCase(), R = $("results");
  if (!q) { R.innerHTML = ""; R.hidden = true; return; }
  const lines = [...new Set([...ROUTES.keys(), ...[...buses.values()].map((b) => b.line)])]
    .filter((l) => l.toLowerCase().startsWith(q)).slice(0, 6);
  // names beat areas beat streets; apostrophes don't matter
  const norm = (t) => String(t || "").toLowerCase().replace(/['’]/g, "");
  const nq = norm(q), seen = new Set(), scored = [];
  for (const s of STOPS) {
    const n = norm(s.name), lo = norm(s.loc), st = norm(s.street);
    const score = n.startsWith(nq) ? 0 : n.includes(" " + nq) ? 1 : lo.startsWith(nq) ? 1.5 : n.includes(nq) ? 2 : (st + " " + lo).includes(nq) ? 3 : -1;
    if (score < 0) continue;
    const k = s.name + "|" + s.loc; if (seen.has(k)) continue; seen.add(k);
    scored.push([score + (s.l?.length ? 0 : 0.5), s]);
  }
  const stops = scored.sort((a, b) => a[0] - b[0] || (b[1].l?.length || 0) - (a[1].l?.length || 0)).slice(0, 8).map((x) => x[1]);
  R.innerHTML = lines.map((l) => `<div data-line="${esc(l)}">${pill(l)} <span>route ${esc(l)}${ROUTES.get(l)?.heads?.length ? " · " + esc(ROUTES.get(l).heads.slice(0, 2).join(" ⇄ ")) : ""}</span></div>`).join("")
    + stops.map((s) => `<div data-stop="${esc(s.id)}"><span class="sd"></span> <span>${esc(stopLabel(s))}<br><span class="muted">${esc([s.street, s.loc].filter(Boolean).join(", "))}</span></span></div>`).join("")
    || '<div class="muted">no stops or routes match</div>';
  R.hidden = false;
  R.querySelectorAll("[data-line]").forEach((d) => d.onclick = () => { focusLine(d.dataset.line); clearSearch(); });
  R.querySelectorAll("[data-stop]").forEach((d) => d.onclick = () => { select({ type: "stop", id: d.dataset.stop }); clearSearch(); });
}
function clearSearch() { $("q").value = ""; $("results").hidden = true; $("q").blur(); }
$("q").addEventListener("input", runSearch);
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Escape") clearSearch();
  if (e.key === "Enter") $("results").querySelector("[data-line],[data-stop]")?.click();
});

// ================================================================ BOOT
$("bHome").onclick = () => { Object.assign(cam, HOME); following = null; showRecenter(); };
$("bStops").onclick = () => { showStops = !showStops; $("bStops").classList.toggle("is-success", showStops); };
$("bRoutes").onclick = () => {
  routesMode = { live: "all", all: "off", off: "live" }[routesMode];
  $("bRoutes").textContent = `routes: ${routesMode}`; store("theroute_routes", routesMode);
};
$("bStyle").onclick = () => {
  mapStyle = mapStyle === "clear" ? "detail" : "clear";
  $("bStyle").textContent = `map: ${mapStyle === "clear" ? "clear" : "detailed"}`; store("theroute_style", mapStyle);
};
$("bRecenter").onclick = () => { if (sel?.type === "bus") { following = sel.id; cam.z = Math.max(cam.z, 2.2); } showRecenter(); };

let cardTick = 0;
async function boot() {
  const j = (u) => fetch(u).then((r) => r.json());
  let rj;
  [META, STOPS, LABELS, rj] = await Promise.all([j("data/meta.json"), j("data/stops.json"), j("data/labels.json"), j("data/routes.json")]);
  for (const s of STOPS) STOP_BY_ID.set(s.id, s);
  for (const r of rj.routes) {
    const path = new Path2D();
    for (const p of r.paths) { path.moveTo(p[0] / rj.scale, p[1] / rj.scale); for (let i = 2; i < p.length; i += 2) path.lineTo(p[i] / rj.scale, p[i + 1] / rj.scale); }
    ROUTES.set(r.line, { line: r.line, heads: r.heads, trips: r.trips, path, raw: r.paths });
  }
  mapStyle = recall("theroute_style") === "detail" ? "detail" : "clear";
  routesMode = ["live", "all", "off"].includes(recall("theroute_routes")) ? recall("theroute_routes") : "live";
  $("bStyle").textContent = `map: ${mapStyle === "clear" ? "clear" : "detailed"}`; $("bRoutes").textContent = `routes: ${routesMode}`;
  resize(); window.addEventListener("resize", resize);
  if (window.innerWidth < 760) cam.z = 1.4;
  if (SAVED.size) setTab("saved"); else renderPanel();
  document.fonts?.load(`11px ${FONT}`);
  requestAnimationFrame(frame);
  j("data/graph.json").then((g) => { G = buildGraph(g); });
  await j("data/patterns.json").then(loadPatterns);           // timetable first, so the first poll can match trips
  poll(); setInterval(poll, POLL_MS);
  setInterval(() => {
    tickStatus(); checkAlerts();
    if (++cardTick % 5 === 0) {
      if (sel && !document.activeElement?.closest?.("#card")) renderCard();        // countdowns stay fresh
      if (tab === "nearby" && nearbyAt && Math.hypot(cam.x - nearbyAt[0], cam.y - nearbyAt[1]) > 40 && !ME) renderPanel();
    }
    // hidden tabs get no rAF; paint anyway so the canvas is never stale
    if (performance.now() - lastFrame > 1000) { const n = performance.now(); stepBuses(n, 16); render(n); lastFrame = n; }
  }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
}
boot();
</script>
</body>
</html>
