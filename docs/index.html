<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>THE ROUTE · Cambridge live buses</title>
<meta name="description" content="Every Cambridge bus live: when it reaches your stop, and where it is now.">
<meta name="theme-color" content="#212529">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Route">
<!-- UI kit: NES.css (MIT, github.com/nostalgic-css/NES.css) · type: Departure Mono (OFL, github.com/rektdeckard/departure-mono) + Press Start 2P (OFL) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nes.css@2.3.0/css/nes.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  @font-face{font-family:"Departure Mono"; src:url("fonts/DepartureMono-Regular.woff2") format("woff2"); font-display:swap}
  :root{
    --night:#181a1f; --panel:#212529; --card:#2b3036; --line:#353a42; --ink:#f4f4f0; --dim:#9aa1ab;
    --blue:#209cee; --green:#92cc41; --gold:#f7d51d; --red:#e76e55;
    --mono:"Departure Mono", ui-monospace, Menlo, Consolas, monospace;
    --pixel:"Press Start 2P", var(--mono);
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{background:var(--night); color:var(--ink); overflow:hidden; font:11px/1.6 var(--mono); display:flex; flex-direction:column; -webkit-font-smoothing:none}
  button{font-family:var(--mono); font-size:11px; color:inherit}
  a{color:var(--blue)}
  .dim{color:var(--dim)}

  /* ---------------------------------------------------------- header: logo · search · live */
  header{display:flex; align-items:center; gap:14px; padding:10px 14px; background:var(--panel); border-bottom:4px solid #000}
  .logo{font:13px var(--pixel); white-space:nowrap}
  .logo b{color:var(--gold); font-weight:400}
  .search{position:relative; flex:1; max-width:520px}
  .search input{width:100%; font:12px var(--mono); padding:8px 10px; background:var(--card); color:var(--ink); border:0; outline:0;
    box-shadow:0 0 0 2px #000; -webkit-appearance:none; border-radius:0}
  .search input::placeholder{color:var(--dim)}
  .search input:focus{box-shadow:0 0 0 2px var(--gold)}
  #results{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:30; background:var(--panel); box-shadow:0 0 0 2px #000, 0 8px 0 rgba(0,0,0,.35); max-height:60vh; overflow:auto}
  #results div{display:flex; gap:10px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer}
  #results div:hover, #results div.on{background:var(--card)}
  .live{display:flex; gap:7px; align-items:center; color:var(--dim); white-space:nowrap; margin-left:auto; cursor:help}
  #dot{width:8px; height:8px; background:var(--green); box-shadow:0 0 0 2px #000; animation:blink 1.6s steps(2) infinite}
  #dot.stale{background:var(--red); animation:none}
  @keyframes blink{50%{opacity:.25}}

  main{flex:1; display:flex; min-height:0}
  #stage{flex:1; position:relative; min-width:0; overflow:hidden; background:#e9e6dc}
  canvas{position:absolute; left:0; top:0; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none}
  .mapbtns{position:absolute; right:12px; bottom:14px; z-index:4; display:flex; flex-direction:column; gap:10px}
  .mapbtns .nes-btn{margin:0; padding:2px 8px; font-size:13px; min-width:38px}
  #bRecenter{position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:5; margin:0; padding:2px 10px; font-size:11px}
  #toast{position:absolute; left:50%; top:14px; transform:translate(-50%,-12px); z-index:9; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none;
    background:#fff; color:#212529; padding:8px 14px; box-shadow:0 0 0 4px #000; max-width:90%; text-align:center}
  #toast.show{opacity:1; transform:translate(-50%,0)}

  /* ---------------------------------------------------------- side panel: one view at a time */
  aside{width:380px; background:var(--panel); border-left:4px solid #000; display:flex; flex-direction:column; min-height:0}
  #view{flex:1; overflow-y:auto; padding:16px 16px 20px}
  .foot{padding:8px 16px; border-top:1px solid var(--line); color:var(--dim); font-size:10px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  .foot button{background:none; border:0; padding:0; color:var(--blue); cursor:pointer; font-size:10px}
  .back{background:none; border:0; padding:0; color:var(--dim); cursor:pointer; margin-bottom:12px}
  .back:hover{color:var(--gold)}
  h1{font:12px var(--pixel); line-height:1.6; margin:0 0 4px; font-weight:400}
  h2{font:9px var(--pixel); color:var(--dim); margin:22px 0 8px; font-weight:400; letter-spacing:1px}
  .sub{color:var(--dim)}
  .title{display:flex; align-items:center; gap:10px}
  .title h1{flex:1; min-width:0}
  .star{background:none; border:0; cursor:pointer; font-size:16px; color:var(--dim); padding:0 2px}
  .star.on{color:var(--gold)}
  .rt{display:inline-block; font:11px var(--mono); padding:0 5px; color:#000; line-height:16px; box-shadow:0 0 0 2px #000; min-width:24px; text-align:center; flex:0 0 auto}
  .rt.big{font:13px var(--pixel); padding:6px 8px; line-height:13px}
  .seg{display:flex; gap:8px; margin-bottom:14px}
  .seg button{flex:1; background:var(--card); border:0; box-shadow:0 0 0 2px #000; padding:6px 0; cursor:pointer; font:9px var(--pixel); color:var(--dim)}
  .seg button.on{background:var(--gold); color:#000}

  /* rows: route · where to · when */
  .rows{list-style:none; margin:0; padding:0}
  .rows li{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line)}
  .rows li.tap{cursor:pointer}
  .rows li.tap:hover .to{color:var(--gold)}
  .rows .to{flex:1; min-width:0}
  .rows .to small{display:block; color:var(--dim); font-size:10px}
  .rows .when{text-align:right; white-space:nowrap}
  .rows .when b{font-weight:400; font-size:12px}
  .rows .when small{display:block; color:var(--dim); font-size:10px}
  .lv{display:inline-block; width:7px; height:7px; background:var(--green); margin-right:5px; vertical-align:1px}
  .late{color:var(--red)} .early{color:var(--blue)} .ontime{color:var(--green)}

  /* stop blocks on the home view */
  .stop{padding:10px 0 4px; border-bottom:2px solid #000; cursor:pointer}
  .stop:last-child{border-bottom:0}
  .stop .nm{display:flex; gap:8px; align-items:baseline}
  .stop .nm span:first-child{flex:1; color:var(--ink)}
  .stop:hover .nm span:first-child{color:var(--gold)}
  .stop .rows li{border-bottom:0; padding:3px 0}
  .empty{color:var(--dim); padding:10px 0}

  /* bus view */
  .status{font-size:13px; margin:10px 0 4px}
  .where{color:var(--dim)}
  .where b{color:var(--ink); font-weight:400}
  .stops li .dot{width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 0 2px #000; flex:0 0 9px}
  .stops li.next .dot{background:var(--gold)}
  .stops li.next .to, .stops li.next .when b{color:var(--gold)}
  .stops li.mine .to{color:var(--gold)}
  .bell{background:none; border:0; cursor:pointer; padding:0 0 0 4px; font-size:12px; opacity:.35; filter:grayscale(1)}
  .bell.on{opacity:1; filter:none}
  .more{background:none; border:0; color:var(--blue); cursor:pointer; padding:8px 0 0}
  details{margin-top:18px; color:var(--dim)}
  details summary{cursor:pointer}
  details .kv{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; margin-top:8px}
  details .kv span:nth-child(even){color:var(--ink)}
  .hintbox{background:var(--card); box-shadow:0 0 0 2px #000; padding:10px 12px; margin:4px 2px 16px; color:var(--dim)}
  .hintbox b{color:var(--ink); font-weight:400}
  .nes-btn.small{font-size:11px; padding:2px 10px; margin:0}

  @media (max-width:760px){
    header{gap:10px; padding:8px 10px}
    .logo{font-size:11px}
    .live span{display:none}
    main{flex-direction:column}
    aside{width:auto; height:48%; border-left:0; border-top:4px solid #000}
    aside.sel{height:58%}
    #view{padding:12px 14px 16px}
    .mapbtns{bottom:10px; right:10px}
  }
</style>
</head>
<body>
<header>
  <div class="logo">THE <b>ROUTE</b></div>
  <div class="search"><input id="q" type="search" placeholder="Search a stop, place or route" autocomplete="off" enterkeyhint="search"><div id="results" hidden></div></div>
  <div class="live" id="live"><i id="dot"></i><span id="status">connecting…</span></div>
</header>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="mapbtns">
      <button class="nes-btn" id="bGps" title="Stops near me">◎</button>
      <button class="nes-btn" id="bHome" title="Back to the city centre">⌂</button>
    </div>
    <button class="nes-btn is-primary" id="bRecenter" hidden>◎ back to the bus</button>
    <div id="toast"></div>
  </div>
  <aside>
    <div id="view"></div>
    <div class="foot"><span id="acc"></span><span id="traf" title="Arrival times use how fast buses are actually moving on each road right now"></span><button id="bStyle">map: clear</button><a href="https://github.com/maxwilliamfoster-sys/the-route#data" target="_blank" rel="noopener">data &amp; credits</a></div>
  </aside>
</main>
<script>
"use strict";
// ======================================================================
//  THE ROUTE — every Cambridge bus, live: where it is, where it's going,
//  and when it will get to your stop.
//
//  Static data (baked): map tiles, stops, road graph (tools/bake.py), route
//  lines (tools/bake_routes.py), journey patterns + run times + calendars
//  (tools/bake_patterns.py), all from OpenStreetMap / NaPTAN / BODS GTFS.
//  Live data: bustimes.org positions (BODS, OGL), plus — when the relay in
//  worker/ is deployed — the official BODS GTFS-RT feed, which names the exact
//  timetabled trip each bus is running. With it, early/late and ETAs are
//  computed against that trip's own timetable; without it, the trip is inferred.
// ======================================================================
const BUSTIMES_URL = (m) =>
  `https://bustimes.org/vehicles.json?ymax=${m.lat1}&xmax=${m.lon1}&ymin=${m.lat0}&xmin=${m.lon0}`;
const RELAY_DEFAULT = "https://the-route-live.maxwilliamfoster.workers.dev";   // worker/ — official GTFS-RT with exact trip ids
const POLL_MS = 12000;
const HOME = { x: 1880, y: 1680, z: 2 };
const FONT = '"Departure Mono", ui-monospace, Menlo, monospace';

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let META, STOPS = [], LABELS = [], ROUTES = new Map(), G = null;
const tiles = new Map();
const overviews = {};
const cam = { ...HOME };
let DPR = 1, CW = 0, CH = 0;
let showStops = true, routesMode = "live", mapStyle = "clear";
const hiddenRoutes = new Set();

// ---------------------------------------------------------------- utils
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const hash8 = (s) => hash(s).toString(16).padStart(8, "0");     // same as fnv() in tools/bake_patterns.py
function proj(lat, lon) { return [(lon - META.lon0) * META.mPerDegLon / META.mpp, (META.lat1 - lat) * META.mPerDegLat / META.mpp]; }
function unproj(x, y) { return [META.lat1 - y * META.mpp / META.mPerDegLat, META.lon0 + x * META.mpp / META.mPerDegLon]; }
const toScreen = (x, y) => [(x - cam.x) * cam.z * DPR + CW / 2, (y - cam.y) * cam.z * DPR + CH / 2];
const toMap = (sx, sy) => [(sx - CW / 2) / (cam.z * DPR) + cam.x, (sy - CH / 2) / (cam.z * DPR) + cam.y];
const metres = (px) => px * META.mpp;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3000); }
function store(k, v) { try { localStorage.setItem(k, v); } catch {} }
function recall(k) { try { return localStorage.getItem(k); } catch { return null; } }
const distTxt = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;

// relay URL: ?relay=https://... once (remembered), or RELAY_DEFAULT
let RELAY = (() => {
  const q = new URLSearchParams(location.search).get("relay");
  if (q !== null) { store("theroute_relay", q); return q || RELAY_DEFAULT; }   // ?relay= resets to the default
  return recall("theroute_relay") || RELAY_DEFAULT;
})();

// saved stops
const SAVED = new Set((() => { try { return JSON.parse(recall("theroute_saved") || "[]"); } catch { return []; } })());
const saveSaved = () => store("theroute_saved", JSON.stringify([...SAVED]));

// ---------------------------------------------------------- route colours
const ROUTE_COL = {
  "1": "#e4422f", "2": "#1f8fe0", "3": "#3aa655", "4": "#e9b11a", "5": "#9b59d0", "6": "#f07d1e",
  "7": "#14b3a3", "8": "#e0458b", "8A": "#c2387a", "13": "#a8743e", "13A": "#8c6034", "18": "#4d8f8f",
  "U1": "#76b82a", "U2": "#5f9be8", "A": "#ff7a1a", "B": "#2f5fd0", "C": "#b7b51c",
  "X3": "#c94f4f", "X13": "#7a5ac8", "905": "#6f7787", "PR1": "#5fb3e8", "PR2": "#f0a04b",
  "PR3": "#62bf6a", "PR4": "#c86ad0", "PR5": "#e86a6a", "T2": "#3c9a7a", "T3": "#a06ad0",
  "T4": "#d08a3c", "T5": "#3c7ad0", "Tour": "#d4a017",
};
const FALLBACK = ["#d9534f", "#2a9fd6", "#4cae4c", "#e6a817", "#9b59d0", "#f0782d", "#17a2b8", "#e83e8c", "#7cb342", "#5c6bc0"];
const routeColour = (line) => !line ? "#8a909a" : ROUTE_COL[line] || FALLBACK[hash(line) % FALLBACK.length];
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#000" : "#fff";
}
const pill = (line, big) => `<span class="rt${big ? " big" : ""}" style="background:${routeColour(line)};color:${inkFor(routeColour(line))}">${esc(line)}</span>`;
const chip = (l) => `<span class="chip" data-line="${esc(l)}" style="background:${routeColour(l)};color:${inkFor(routeColour(l))}">${esc(l)}</span>`;

// ================================================================ ROAD GRAPH
// Moves between reported positions follow the real road network (A*).
function buildGraph(g) {
  const s = g.scale, N = g.n.length / 2;
  const X = new Float32Array(N), Y = new Float32Array(N);
  for (let i = 0; i < N; i++) { X[i] = g.n[2 * i] / s; Y[i] = g.n[2 * i + 1] / s; }
  const E = g.e.length / 3;
  const ea = new Int32Array(E), eb = new Int32Array(E), eo = new Uint8Array(E);
  const deg = new Int32Array(N + 1);
  for (let k = 0; k < E; k++) { ea[k] = g.e[3 * k]; eb[k] = g.e[3 * k + 1]; eo[k] = g.e[3 * k + 2]; deg[ea[k]]++; if (!eo[k]) deg[eb[k]]++; }
  const off = new Int32Array(N + 1);
  for (let i = 0; i < N; i++) off[i + 1] = off[i] + deg[i];
  const adj = new Int32Array(off[N]), fill = off.slice(0, N);
  for (let k = 0; k < E; k++) { adj[fill[ea[k]]++] = eb[k]; if (!eo[k]) adj[fill[eb[k]]++] = ea[k]; }
  const CELL = 48, gw = Math.ceil(META.W / CELL) + 10;
  const grid = new Map(), cellKey = (cx, cy) => cy * gw + cx;
  for (let k = 0; k < E; k++) {
    const a = ea[k], b = eb[k];
    const x0 = Math.floor(Math.min(X[a], X[b]) / CELL), x1 = Math.floor(Math.max(X[a], X[b]) / CELL);
    const y0 = Math.floor(Math.min(Y[a], Y[b]) / CELL), y1 = Math.floor(Math.max(Y[a], Y[b]) / CELL);
    for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
      const key = cellKey(cx + 5, cy + 5); let l = grid.get(key); if (!l) grid.set(key, l = []); l.push(k);
    }
  }
  return { X, Y, ea, eb, eo, off, adj, grid, CELL, cellKey };
}
function snap(px, py, maxD = 14) {
  const { X, Y, ea, eb, eo, grid, CELL, cellKey } = G;
  const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL), found = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    const l = grid.get(cellKey(cx + dx + 5, cy + dy + 5)); if (!l) continue;
    for (const k of l) {
      const a = ea[k], b = eb[k], vx = X[b] - X[a], vy = Y[b] - Y[a], L2 = vx * vx + vy * vy || 1e-9;
      const t = clamp(((px - X[a]) * vx + (py - Y[a]) * vy) / L2, 0, 1), qx = X[a] + vx * t, qy = Y[a] + vy * t;
      const d = Math.hypot(px - qx, py - qy);
      if (d <= maxD) found.push({ k, t, x: qx, y: qy, d, a, b, ow: eo[k], len: Math.sqrt(L2) });
    }
  }
  found.sort((p, q) => p.d - q.d);
  const out = [], seen = new Set();
  for (const f of found) { if (seen.has(f.k)) continue; seen.add(f.k); out.push(f); if (out.length >= 3) break; }
  return out;
}
function route(s, e, limit = 6000) {
  const { X, Y, off, adj } = G;
  const gScore = new Map(), came = new Map(), heap = [];
  const push = (n, f) => { heap.push([f, n]); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  const H_ = (n) => Math.hypot(X[n] - e.x, Y[n] - e.y);
  if (s.k === e.k && (e.t >= s.t || !s.ow)) return { pts: [[s.x, s.y], [e.x, e.y]], len: Math.hypot(e.x - s.x, e.y - s.y) };
  const startN = [[s.b, (1 - s.t) * s.len]]; if (!s.ow) startN.push([s.a, s.t * s.len]);
  for (const [n, c] of startN) { gScore.set(n, c); came.set(n, -1); push(n, c + H_(n)); }
  const goal = new Map(); goal.set(e.a, e.t * e.len); if (!e.ow) goal.set(e.b, (1 - e.t) * e.len);
  let best = Infinity, bestN = -1, it = 0;
  while (heap.length && it++ < limit) {
    const [f, n] = pop(); if (f >= best) break;
    const gn = gScore.get(n);
    if (goal.has(n)) { const tot = gn + goal.get(n); if (tot < best) { best = tot; bestN = n; } }
    for (let i = off[n]; i < off[n + 1]; i++) {
      const m = adj[i], c = gn + Math.hypot(X[m] - X[n], Y[m] - Y[n]);
      if (c < (gScore.get(m) ?? Infinity)) { gScore.set(m, c); came.set(m, n); push(m, c + H_(m)); }
    }
  }
  if (bestN < 0) return null;
  const pts = [[e.x, e.y]];
  for (let n = bestN; n !== -1; n = came.get(n)) pts.push([X[n], Y[n]]);
  pts.push([s.x, s.y]); pts.reverse();
  return { pts, len: best };
}
function roadPath(x0, y0, x1, y1) {
  const straight = Math.hypot(x1 - x0, y1 - y0);
  if (!G || straight < 1.5 || straight > 900) return { pts: [[x0, y0], [x1, y1]], len: straight };
  const S = snap(x0, y0), E = snap(x1, y1);
  let best = null;
  for (const s of S.slice(0, 2)) for (const e of E.slice(0, 2)) {
    const r = route(s, e);
    if (r && (!best || r.len + s.d + e.d < best.len)) best = { pts: r.pts, len: r.len + s.d + e.d };
  }
  if (!best || best.len > straight * 2.6 + 60) return { pts: [[x0, y0], [x1, y1]], len: straight };
  best.pts.unshift([x0, y0]); best.pts.push([x1, y1]);
  return best;
}
function along(path, d) {
  const p = path.pts;
  for (let i = 1; i < p.length; i++) {
    const seg = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= seg || i === p.length - 1) {
      const t = seg ? clamp(d / seg, 0, 1) : 1;
      return { x: p[i - 1][0] + (p[i][0] - p[i - 1][0]) * t, y: p[i - 1][1] + (p[i][1] - p[i - 1][1]) * t,
               ang: seg > 0.05 ? Math.atan2(p[i][1] - p[i - 1][1], p[i][0] - p[i - 1][0]) : null };
    }
    d -= seg;
  }
  const l = p[p.length - 1]; return { x: l[0], y: l[1], ang: null };
}

// ================================================================ LIVE BUSES
const buses = new Map();
let lastPoll = 0, lastOk = 0, polling = false;

function nearestStop(x, y) {
  let best = null, bd = 1e9;
  for (const s of STOPS) { const d = Math.hypot(s.x - x, s.y - y); if (d < bd) { bd = d; best = s; } }
  return best && bd < 60 ? best : null;
}
function fitLine(line) {
  const R = ROUTES.get(line);
  const xs = [...buses.values()].filter((b) => b.line === line).map((b) => [b.x, b.y]);
  if (R) for (const p of R.raw) for (let i = 0; i < p.length; i += 8) xs.push([p[i] / 2, p[i + 1] / 2]);
  if (!xs.length) return;
  const X = xs.map((p) => p[0]), Y = xs.map((p) => p[1]);
  cam.x = (Math.min(...X) + Math.max(...X)) / 2; cam.y = (Math.min(...Y) + Math.max(...Y)) / 2;
  const span = Math.max(Math.max(...X) - Math.min(...X), (Math.max(...Y) - Math.min(...Y)) * (CW / CH), 150);
  cam.z = clamp(CW / DPR / (span * 1.15), 0.3, 3); clampCam();
}
const focusLine = (line) => select({ type: "line", id: line });

// ================================================================ VIEWS
const STATUS_CLS = { green: "ontime", late: "late", early: "early" };
function depRow(d) {
  let note = "timetable";
  if (d.bus) {
    const dt = delayText(d.delay);
    note = `<span class="lv"></span>live${d.delay != null && dt.c !== "green" ? ` · <span class="${STATUS_CLS[dt.c] || ""}">${dt.t}</span>` : ""}`;
  }
  return `<li class="${d.bus ? "tap" : ""}" ${d.bus ? `data-bus="${d.bus.id}"` : ""}>${pill(d.line)}
    <span class="to">${esc(d.head)}<small>${note}</small></span>
    <span class="when"><b>${mins(d.eta)}</b><small>${hm(d.at)}</small></span></li>`;
}
function stopBlock(s, extra) {
  const deps = departures(s.id, 3600).slice(0, 3);
  return `<div class="stop" data-stop="${esc(s.id)}">
    <div class="nm"><span>${esc(stopLabel(s))}</span><span class="dim">${extra || ""}</span></div>
    <ul class="rows">${deps.length ? deps.map(depRow).join("") : '<li class="dim">nothing in the next hour</li>'}</ul></div>`;
}

function homeView() {
  let body;
  if (homeTab === "nearby") {
    let ox = cam.x, oy = cam.y, you = false;
    if (ME) { const [x, y] = proj(ME.lat, ME.lon); if (x >= 0 && y >= 0 && x <= META.W && y <= META.H) { ox = x; oy = y; you = true; } }
    nearbyAt = [ox, oy];
    const seen = new Set(), list = [];
    for (const s of [...STOPS].sort((a, b) => Math.hypot(a.x - ox, a.y - oy) - Math.hypot(b.x - ox, b.y - oy))) {
      if (list.length >= 4 || metres(Math.hypot(s.x - ox, s.y - oy)) > 1000) break;
      const k = s.name + "|" + s.ind; if (seen.has(k)) continue; seen.add(k); list.push(s);
    }
    body = `<p class="sub" style="margin:0 0 6px">${you ? "Stops near you" : `Stops near the middle of the map · <a href="#" id="hGps">use my location</a>`}</p>`
      + (list.map((s) => stopBlock(s, distTxt(metres(Math.hypot(s.x - ox, s.y - oy))))).join("") || '<p class="empty">No stops here. Move the map.</p>');
  } else {
    const list = [...SAVED].map((id) => STOP_BY_ID.get(id)).filter(Boolean);
    body = list.length ? list.map((s) => stopBlock(s)).join("")
      : `<p class="empty">No saved stops yet. Open a stop and tap ☆ to keep it here.</p>`;
  }
  const tips = recall("theroute_tips") ? "" : `<div class="hintbox"><b>Tap a stop</b> to see when buses leave it.<br><b>Tap a bus</b> on the map to see when it reaches each stop.<br><a href="#" id="hTips">got it</a></div>`;
  return `${tips}<div class="seg"><button data-tab="nearby" class="${homeTab === "nearby" ? "on" : ""}">NEARBY</button><button data-tab="saved" class="${homeTab === "saved" ? "on" : ""}">SAVED${SAVED.size ? " " + SAVED.size : ""}</button></div>${body}`;
}

function stopView(s) {
  const deps = departures(s.id).slice(0, 10), dm = meTo(s.x, s.y), saved = SAVED.has(s.id);
  return `<button class="back" id="vBack">← back</button>
    <div class="title"><h1>${esc(s.name)}${s.ind ? ` <span class="dim">(${esc(s.ind)})</span>` : ""}</h1>
      <button class="star ${saved ? "on" : ""}" id="vSave" title="${saved ? "Remove from saved" : "Save this stop"}">${saved ? "★" : "☆"}</button></div>
    <div class="sub">${esc([s.street, s.loc].filter(Boolean).join(", "))}${dm != null ? ` · ${distTxt(dm)} away` : ""}</div>
    <h2>NEXT BUSES</h2>
    <ul class="rows">${deps.length ? deps.map(depRow).join("") : '<li class="dim">Nothing due in the next 90 minutes.</li>'}</ul>
    ${s.l?.length ? `<h2>ROUTES FROM HERE</h2><div style="display:flex;flex-wrap:wrap;gap:8px">${s.l.map((l) => `<span class="rt tap-line" data-line="${esc(l)}" style="cursor:pointer;background:${routeColour(l)};color:${inkFor(routeColour(l))}">${esc(l)}</span>`).join("")}</div>` : ""}`;
}

function busView(b) {
  const J = journey(b);
  let status, where;
  if (!J) status = `<span class="dim">Live position only (no timetable for this service)</span>`;
  else if (J.layover) status = `Waiting to leave at ${hm(J.startAt)}`;
  else { const dt = delayText(J.delay); status = `<span class="${STATUS_CLS[dt.c] || ""}">${dt.t === "on time" ? "On time" : dt.t[0].toUpperCase() + dt.t.slice(1)}</span>`; }
  if (J?.traffic && J.traffic > 1.2) status += ` <span class="dim">· slow traffic ahead</span>`;
  else if (J?.traffic && J.traffic < 0.85) status += ` <span class="dim">· clear roads ahead</span>`;
  if (J?.atStop) where = `Now at <b>${esc(J.atStop.name)}</b>`;
  else if (J?.prevStop && J.up[0]) where = `Now between <b>${esc(J.prevStop.name)}</b> and <b>${esc(J.up[0].s.name)}</b>`;
  else { const n = nearestStop(b.fx, b.fy); where = n ? `Now near <b>${esc(n.name)}</b>` : "Between stops"; }
  const ups = J ? (showAllStops ? J.up : J.up.slice(0, 6)) : [];
  const age = Math.max(0, Math.round((Date.now() - b.feedTime) / 1000));
  return `<button class="back" id="vBack">← back</button>
    <div class="title">${pill(b.line, true)}<h1>to ${esc(b.dest || J?.P.head || "?")}</h1></div>
    <div class="status">${status}</div>
    <div class="where">${where}</div>
    ${J ? `<h2>NEXT STOPS</h2>
    <ul class="rows stops">${ups.map((u, k) => {
      const key = b.id + "|" + u.id, on = alerts.has(key);
      const diff = u.sched != null && hm(u.sched) !== hm(u.at);
      return `<li class="tap ${k === 0 ? "next" : ""}" data-stop="${esc(u.id)}"><span class="dot"></span>
        <span class="to">${esc(stopLabel(u.s))}${diff ? `<small>timetabled ${hm(u.sched)}</small>` : ""}</span>
        <span class="when"><b>${mins(u.eta)}</b><small>${hm(u.at)}</small></span>
        <button class="bell ${on ? "on" : ""}" data-alert="${esc(key)}" title="Alert me 2 minutes before it gets here">${on ? "⏰" : "🔔"}</button></li>`;
    }).join("")}</ul>
    ${J.up.length > 6 ? `<button class="more" id="vMore">${showAllStops ? "show fewer" : `show all ${J.up.length} stops →`}</button>` : ""}` : ""}
    <details id="vMoreInfo"><summary>More about this bus</summary><div class="kv">
      ${J ? `<span>journey</span><span>${esc(J.first.name)}${J.startAt ? " " + hm(J.startAt) : ""} → ${esc(J.last.name)}${J.schedEnd ? " " + hm(J.schedEnd) : ""}</span>` : ""}
      <span>speed</span><span>${b.kmh == null ? "measuring" : b.kmh < 3 ? "stopped" : Math.round(b.kmh) + " km/h"}</span>
      <span>traffic ahead</span><span>${J?.traffic ? (Math.abs(J.traffic - 1) < 0.08 ? "as timetabled" : `${Math.round(Math.abs(J.traffic - 1) * 100)}% ${J.traffic > 1 ? "slower" : "faster"} than timetabled (live)`) : "no recent readings"}</span>
      <span>last report</span><span>${age < 5 ? "just now" : age + " s ago"}</span>
      <span>vehicle</span><span>${esc(b.fleet)}${b.reg ? " · " + esc(b.reg) : ""}${b.features ? " · " + esc(b.features.toLowerCase()) : ""}</span>
      <span>times from</span><span>${J ? (J.how === "exact" ? "its exact timetabled trip" : "the timetable trip it best matches") : "—"}</span>
    </div></details>`;
}

function lineView(line) {
  const R = ROUTES.get(line);
  const list = [...buses.values()].filter((b) => !b.gone && b.line === line).map((b) => ({ b, J: journey(b) }));
  return `<button class="back" id="vBack">← back</button>
    <div class="title">${pill(line, true)}<h1>${esc(R?.heads?.slice(0, 2).join(" ⇄ ") || "Route " + line)}</h1></div>
    <h2>${list.length ? `${list.length} BUS${list.length === 1 ? "" : "ES"} RUNNING NOW` : "NONE RUNNING NOW"}</h2>
    <ul class="rows">${list.map(({ b, J }) => {
      const dt = J ? delayText(J.delay) : null;
      return `<li class="tap" data-bus="${b.id}"><span class="to">to ${esc(b.dest || J?.P.head || "?")}
        <small>${J?.up[0] ? "next: " + esc(J.up[0].s.name) + " in " + mins(J.up[0].eta) : "live position"}</small></span>
        <span class="when ${dt ? STATUS_CLS[dt.c] || "" : ""}">${J?.layover ? "waiting" : dt ? dt.t : ""}</span></li>`;
    }).join("")}</ul>`;
}

let nearbyAt = null;
function renderView() {
  const V = $("view");
  if (!META) return;
  document.querySelector("aside").classList.toggle("sel", !!sel);
  const open = V.querySelector("#vMoreInfo")?.open;
  if (!sel) V.innerHTML = homeView();
  else if (sel.type === "stop") { const s = STOP_BY_ID.get(sel.id); if (!s) return closeCard(); V.innerHTML = stopView(s); }
  else if (sel.type === "bus") { const b = buses.get(sel.id); if (!b) { toast("That bus has finished its journey"); return goBack(); } V.innerHTML = busView(b); }
  else V.innerHTML = lineView(sel.id);
  if (open && $("vMoreInfo")) $("vMoreInfo").open = true;
  wire(V);
}
function wire(V) {
  V.querySelectorAll(".seg button").forEach((b) => b.onclick = () => { homeTab = b.dataset.tab; renderView(); });
  V.querySelectorAll(".stop[data-stop]").forEach((d) => d.onclick = (e) => {
    const li = e.target.closest("li[data-bus]");
    if (li) select({ type: "bus", id: +li.dataset.bus }); else select({ type: "stop", id: d.dataset.stop });
  });
  V.querySelectorAll(".rows li[data-bus]").forEach((li) => { if (!li.closest(".stop")) li.onclick = () => select({ type: "bus", id: +li.dataset.bus }); });
  V.querySelectorAll(".stops li[data-stop]").forEach((li) => li.onclick = () => {
    const s = stopInfo(li.dataset.stop);
    if (s.x != null) { following = null; cam.x = s.x; cam.y = s.y; cam.z = Math.max(cam.z, 2.6); showRecenter(); }
  });
  V.querySelectorAll("[data-alert]").forEach((x) => x.onclick = (e) => {
    e.stopPropagation();
    const k = x.dataset.alert;
    if (alerts.has(k)) { alerts.delete(k); toast("Alert off"); }
    else {
      alerts.set(k, false); toast("⏰ You'll get an alert 2 minutes before it arrives");
      try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch {}
    }
    renderView();
  });
  V.querySelectorAll(".tap-line").forEach((c) => c.onclick = () => focusLine(c.dataset.line));
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("vBack", goBack);
  on("vMore", () => { showAllStops = !showAllStops; renderView(); });
  on("vSave", () => {
    const id = sel.id;
    if (SAVED.has(id)) SAVED.delete(id); else SAVED.add(id);
    saveSaved(); toast(SAVED.has(id) ? "Saved. Find it under SAVED" : "Removed from saved"); renderView();
  });
  on("hGps", (e) => { e.preventDefault(); startGps(); });
  on("hTips", (e) => { e.preventDefault(); store("theroute_tips", "1"); renderView(); });
}
// names the engine and renderer already use
const renderCard = renderView, renderPanel = renderView;
function onLiveUpdate() { renderView(); }

function tickStatus() {
  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
  const all = [...buses.values()].filter((b) => !b.gone), exact = all.filter((b) => b.m?.how === "exact").length;
  $("status").textContent = age == null ? "connecting…" : `${all.length} buses live`;
  $("dot").classList.toggle("stale", age == null || age > 60);
  $("live").title = age == null ? "Connecting to live data" : `Updated ${age}s ago`;
  const acc = $("acc");
  const roads = [...TRAFFIC.values()].filter((c) => Date.now() - c.t < 15 * 60e3).length;
  $("traf").textContent = roads > 20 ? `live traffic: ${roads} road sections` : "live traffic: learning…";
  if (relayLive()) { acc.textContent = `exact trips: ${exact}/${all.length}`; acc.title = "These buses report the exact timetabled journey they're running, so their times are calculated from it."; }
  else { acc.textContent = "times: estimated"; acc.title = "Each bus's journey is worked out from its position and direction."; }
}

// ================================================================ SEARCH
let hits = [], hitAt = -1;
function runSearch() {
  const q = $("q").value.trim().toLowerCase(), R = $("results");
  if (!q) { R.innerHTML = ""; R.hidden = true; return; }
  const lines = [...new Set([...ROUTES.keys(), ...[...buses.values()].map((b) => b.line)])]
    .filter((l) => l.toLowerCase().startsWith(q)).sort((a, b) => a.length - b.length).slice(0, 4);
  // names beat areas beat streets; apostrophes don't matter
  const norm = (t) => String(t || "").toLowerCase().replace(/['’]/g, "");
  const nq = norm(q), seen = new Set(), scored = [];
  for (const s of STOPS) {
    const n = norm(s.name), lo = norm(s.loc), st = norm(s.street);
    const score = n.startsWith(nq) ? 0 : n.includes(" " + nq) ? 1 : lo.startsWith(nq) ? 1.5 : n.includes(nq) ? 2 : (st + " " + lo).includes(nq) ? 3 : -1;
    if (score < 0) continue;
    const k = s.name + "|" + s.ind; if (seen.has(k)) continue; seen.add(k);
    scored.push([score + (s.l?.length ? 0 : 0.5), s]);
  }
  const stops = scored.sort((a, b) => a[0] - b[0] || (b[1].l?.length || 0) - (a[1].l?.length || 0)).slice(0, 8).map((x) => x[1]);
  hits = [...lines.map((l) => ({ line: l })), ...stops.map((s) => ({ stop: s }))]; hitAt = -1;
  R.innerHTML = hits.map((h, i) => h.line
    ? `<div data-i="${i}">${pill(h.line)}<span>Route ${esc(h.line)}<br><span class="dim">${esc(ROUTES.get(h.line)?.heads?.slice(0, 2).join(" ⇄ ") || "")}</span></span></div>`
    : `<div data-i="${i}"><span class="rt" style="background:#fff">●</span><span>${esc(stopLabel(h.stop))}<br><span class="dim">${esc([h.stop.street, h.stop.loc].filter(Boolean).join(", "))}</span></span></div>`).join("")
    || '<div class="dim">No stops or routes match</div>';
  R.hidden = false;
  R.querySelectorAll("[data-i]").forEach((d) => d.onclick = () => pickHit(+d.dataset.i));
}
function pickHit(i) {
  const h = hits[i]; if (!h) return;
  clearSearch();
  if (h.line) focusLine(h.line); else select({ type: "stop", id: h.stop.id });
}
function clearSearch() { $("q").value = ""; $("results").hidden = true; $("q").blur(); }
$("q").addEventListener("input", runSearch);
$("q").addEventListener("keydown", (e) => {
  const items = [...$("results").querySelectorAll("[data-i]")];
  if (e.key === "Escape") clearSearch();
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); hitAt = clamp(hitAt + (e.key === "ArrowDown" ? 1 : -1), 0, items.length - 1);
    items.forEach((d, i) => d.classList.toggle("on", i === hitAt));
  } else if (e.key === "Enter") pickHit(hitAt >= 0 ? hitAt : 0);
});
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) $("results").hidden = true; });

// ================================================================ BOOT
$("bHome").onclick = () => { Object.assign(cam, HOME); following = null; showRecenter(); };
$("bStyle").onclick = () => {
  mapStyle = mapStyle === "clear" ? "detail" : "clear";
  $("bStyle").textContent = `map: ${mapStyle === "clear" ? "clear" : "detailed"}`; store("theroute_style", mapStyle);
};
$("bRecenter").onclick = () => { if (sel?.type === "bus") { following = sel.id; cam.z = Math.max(cam.z, 2.2); } showRecenter(); };

let viewTick = 0;
async function boot() {
  const j = (u) => fetch(u).then((r) => r.json());
  let rj;
  [META, STOPS, LABELS, rj] = await Promise.all([j("data/meta.json"), j("data/stops.json"), j("data/labels.json"), j("data/routes.json")]);
  for (const s of STOPS) STOP_BY_ID.set(s.id, s);
  for (const r of rj.routes) {
    const path = new Path2D();
    for (const p of r.paths) { path.moveTo(p[0] / rj.scale, p[1] / rj.scale); for (let i = 2; i < p.length; i += 2) path.lineTo(p[i] / rj.scale, p[i + 1] / rj.scale); }
    ROUTES.set(r.line, { line: r.line, heads: r.heads, trips: r.trips, path, raw: r.paths });
  }
  mapStyle = recall("theroute_style") === "detail" ? "detail" : "clear";
  $("bStyle").textContent = `map: ${mapStyle === "clear" ? "clear" : "detailed"}`;
  if (SAVED.size) homeTab = "saved";
  loadTraffic(); setInterval(saveTraffic, 60e3); window.addEventListener("pagehide", saveTraffic);
  resize(); window.addEventListener("resize", resize);
  if (window.innerWidth < 760) cam.z = 1.6;
  renderView();
  document.fonts?.load(`11px ${FONT}`);
  requestAnimationFrame(frame);
  j("data/graph.json").then((g) => { G = buildGraph(g); });
  await j("data/patterns.json").then(loadPatterns);            // timetable first, so the first poll can match trips
  poll(); setInterval(poll, POLL_MS);
  setInterval(() => {
    tickStatus(); checkAlerts();
    if (++viewTick % 5 === 0 && !document.activeElement?.closest?.("#view")) {
      // keep countdowns fresh; the home list follows the map when you're not using GPS
      if (sel || !nearbyAt || ME || Math.hypot(cam.x - nearbyAt[0], cam.y - nearbyAt[1]) > 40 || viewTick % 15 === 0) renderView();
    }
    if (performance.now() - lastFrame > 1000) { const n = performance.now(); stepBuses(n, Math.min(1000, n - lastFrame)); render(n); lastFrame = n; }
  }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
}
boot();
</script>
</body>
</html>
